spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:riskguard}
    username: ${DB_USERNAME:${POSTGRES_USER:riskguard}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:change-me-local-only}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      enable-idempotence: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:riskguard-transaction-service}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false
app:
  idempotency:
    expiration-seconds: ${IDEMPOTENCY_EXPIRATION_SECONDS:86400}
  outbox:
    poll-ms: ${OUTBOX_POLL_MS:1000}
  kafka:
    transaction-created-topic: ${KAFKA_TRANSACTION_CREATED_TOPIC:transaction.created.v1}
    fraud-result-topic: ${KAFKA_FRAUD_RESULT_TOPIC:fraud.analysis.completed.v1}
    fraud-dlq-topic: ${KAFKA_FRAUD_DLQ_TOPIC:fraud.analysis.dlq.v1}
    transaction-consumer-group: ${KAFKA_CONSUMER_GROUP:riskguard-transaction-service}
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:900}
      refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:604800}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:10}
    transaction-per-minute: ${RATE_LIMIT_TRANSACTION_PER_MINUTE:60}
    refresh-per-minute: ${RATE_LIMIT_REFRESH_PER_MINUTE:20}
    admin-per-minute: ${RATE_LIMIT_ADMIN_PER_MINUTE:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
