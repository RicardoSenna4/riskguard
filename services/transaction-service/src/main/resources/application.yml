spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:riskguard}
    username: ${DB_USERNAME:${POSTGRES_USER:riskguard}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:change-me-local-only}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false
app:
  idempotency:
    expiration-seconds: ${IDEMPOTENCY_EXPIRATION_SECONDS:86400}
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:900}
      refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:604800}
