name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  java:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/transaction-service}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      # RUN_CONTAINERS enables the Testcontainers suites (PostgreSQL, Kafka, Redis) on the runner's Docker.
      - run: mvn -B verify | tee mvn.log
        shell: bash
        env: {RUN_CONTAINERS: 'true'}
      - name: Annotate failed tests
        if: failure()
        run: |
          for f in target/surefire-reports/*.txt; do
            grep -q -E 'FAILURE|ERROR' "$f" || continue
            { grep -m1 -A3 -E '<<< (FAILURE|ERROR)!' "$f" | tail -n +2 | cut -c1-400; grep -E '^Caused by:' "$f" | cut -c1-600; } > summary.txt
            printf '::error title=%s::%s\n' "$(basename "$f" .txt)" "$(head -c 3500 summary.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          done
          printf '::error title=maven::%s\n' "$(grep -E '^\[ERROR\]' mvn.log | head -40 | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
  python:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/fraud-service}}
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: riskguard_fraud, POSTGRES_USER: riskguard, POSTGRES_PASSWORD: ci-only}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U riskguard -d riskguard_fraud"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FRAUD_TEST_DATABASE_URL: postgresql+psycopg://riskguard:ci-only@localhost:5432/riskguard_fraud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@v5
        with: {version: '0.6.14'}
      - run: uv sync --extra dev
      - run: uv run ruff check src tests ml
      - run: uv run mypy src
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --env-file .env -f infrastructure/docker/docker-compose.yml config -q
      - run: docker build -t riskguard-transaction:ci services/transaction-service
      - run: docker build -t riskguard-fraud:ci services/fraud-service
      - run: docker build -t riskguard-frontend:ci frontend
  e2e:
    # Full stack (Compose) proving the event-driven flow across both services.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Create CI-only .env
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 32)|" .env
      - run: scripts/dev-up.sh
      - run: scripts/e2e-event-flow.sh
      - name: Compose diagnostics
        if: failure()
        run: |
          compose() { docker compose --env-file .env -f infrastructure/docker/docker-compose.yml "$@"; }
          compose ps -a
          compose ps -a --format '{{.Service}} {{.State}} {{.Health}}' | while read -r service state health; do
            [[ "$state" == running && "$health" != unhealthy && "$health" != starting ]] && continue
            printf '::error title=%s %s %s::%s\n' "$service" "$state" "$health" \
              "$(compose logs --no-color --tail=25 "$service" | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          done
          compose logs --tail=200
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: {scan-type: fs, scan-ref: ., severity: 'CRITICAL,HIGH', ignore-unfixed: true, format: json, output: trivy.json, exit-code: '0'}
      - name: Fail on CRITICAL/HIGH findings
        run: |
          jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? | "::error title=\(.Severity) \(.VulnerabilityID)::\($t): \(.PkgName) \(.InstalledVersion) -> fixed in \(.FixedVersion)"' trivy.json | sort -u | tee findings.txt
          test ! -s findings.txt
      - uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
