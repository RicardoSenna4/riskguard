name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  java:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/transaction-service}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      # RUN_CONTAINERS enables the Testcontainers suites (PostgreSQL, Kafka, Redis) on the runner's Docker.
      - run: mvn -B verify
        env: {RUN_CONTAINERS: 'true'}
  python:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/fraud-service}}
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: riskguard_fraud, POSTGRES_USER: riskguard, POSTGRES_PASSWORD: ci-only}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U riskguard -d riskguard_fraud"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FRAUD_TEST_DATABASE_URL: postgresql+psycopg://riskguard:ci-only@localhost:5432/riskguard_fraud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - uses: astral-sh/setup-uv@v5
        with: {version: '0.6.14'}
      - run: uv sync --extra dev
      - run: uv run ruff check src tests ml
      - run: uv run mypy src
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f infrastructure/docker/docker-compose.yml config -q
      - run: docker build -t riskguard-transaction:ci services/transaction-service
      - run: docker build -t riskguard-fraud:ci services/fraud-service
      - run: docker build -t riskguard-frontend:ci frontend
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with: {scan-type: fs, scan-ref: ., severity: 'CRITICAL,HIGH', ignore-unfixed: true, exit-code: '1'}
      - uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
